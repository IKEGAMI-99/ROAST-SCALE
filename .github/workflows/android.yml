name: Android CI + signed GitHub Releases

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests and compile debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roast-scale-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "Missing signing secrets"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          printf "%s" "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/roast-release.jks"
          chmod 600 "$RUNNER_TEMP/roast-release.jks"
      - name: Derive Android version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]
          test "$MINOR" -lt 100 && test "$PATCH" -lt 100
          echo "ROAST_VERSION_CODE=$((MAJOR*10000 + MINOR*100 + PATCH))" >> "$GITHUB_ENV"
          echo "ROAST_VERSION_NAME=$TAG" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ROAST_KEYSTORE: ${{ runner.temp }}/roast-release.jks
          ROAST_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ROAST_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ROAST_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Package and checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk roast-scale.apk
          sha256sum roast-scale.apk > roast-scale.apk.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" roast-scale.apk roast-scale.apk.sha256 \
            --generate-notes --title "ROAST SCALE $GITHUB_REF_NAME"
