name: Android CI and GitHub Releases

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roast-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Run tests and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK (not OTA-compatible)
        uses: actions/upload-artifact@v4
        with:
          name: roast-scale-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  signed-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Check permanent signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::Set SIGNING_KEYSTORE_BASE64 in GitHub Actions secrets (see README)"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "::error::Set SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "::error::Set SIGNING_KEY_PASSWORD"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "::error::Set SIGNING_KEY_ALIAS"; exit 1; }
          printf "%s" "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/roast-release.p12"
          chmod 600 "$RUNNER_TEMP/roast-release.p12"
      - name: Set next automatic release version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [[ "$LATEST" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="$((${BASH_REMATCH[3]} + 1))"
            if ((PATCH >= 100)); then PATCH=0; MINOR="$((MINOR + 1))"; fi
            if ((MINOR >= 100)); then MINOR=0; MAJOR="$((MAJOR + 1))"; fi
          else
            MAJOR=0
            MINOR=1
            PATCH=1
          fi
          TAG="v$MAJOR.$MINOR.$PATCH"
          echo "ROAST_TAG=$TAG" >> "$GITHUB_ENV"
          echo "ROAST_VERSION_NAME=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_ENV"
          echo "ROAST_VERSION_CODE=$((MAJOR*10000 + MINOR*100 + PATCH))" >> "$GITHUB_ENV"
          echo "Signing release $TAG"
      - name: Build release with permanent signing key
        env:
          ROAST_KEYSTORE: ${{ runner.temp }}/roast-release.p12
          ROAST_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ROAST_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ROAST_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: Verify APK and checksum
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk roast-scale.apk
          sha256sum roast-scale.apk > roast-scale.apk.sha256
      - name: Publish release for app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$ROAST_TAG" roast-scale.apk roast-scale.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "ROAST SCALE $ROAST_TAG" \
            --generate-notes
